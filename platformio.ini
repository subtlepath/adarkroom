; A Dark Room for the Xteink X4 Pro, the X4 Classic and the X3, on the FreeInk SDK (freeink-sdk/, a pinned
; submodule). Build with `make firmware` (scripts/pio.sh keeps PlatformIO under build/).
;   x4pro  the X4 Pro: ESP32-S3, 800 x 480, touch, Home key, frontlight
;   x4c    the X4 Classic: the X4 Pro's board and glass, seven keys, no touch, no light
;   x3     the X3 (and the ESP32-C3 X4): 792 x 528 (800 x 480), seven keys; one binary drives both

[platformio]
default_envs = x4pro, x4c, x3
src_dir = src

[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
  -std=gnu++2a
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -I${PROJECT_DIR}/include
build_src_flags =
  -Wall -Wextra
build_unflags =
  -std=gnu++11
lib_deps =
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  RecoveryBoot=symlink://freeink-sdk/libs/hardware/RecoveryBoot

[env:x4pro]
extends = common
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_DEVICE_X4PRO=1
  -DARDUINO_LOOP_STACK_SIZE=16384
lib_deps =
  ${common.lib_deps}
  FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

[env:x4c]
extends = common
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${common.build_flags}
  -DBOARD_HAS_PSRAM
  -DUSE_BLOCK_DEVICE_INTERFACE=1
  -DFREEINK_DEVICE_X4CLASSIC=1
  -DARDUINO_LOOP_STACK_SIZE=16384

[env:x3]
extends = common
board = esp32-c3-devkitm-1
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
  ${common.build_flags}
  -DFREEINK_DEVICE_X3=1
  -DARDUINO_LOOP_STACK_SIZE=16384
